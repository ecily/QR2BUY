[platformio]
default_envs = prototype3_display_test

[env:prototype3_display_test]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Require an explicit port at upload time; do not inherit Device 1/2 ports.
upload_port = REQUIRE_EXPLICIT_PROTOTYPE3_PORT
monitor_port = REQUIRE_EXPLICIT_PROTOTYPE3_PORT
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -D USER_SETUP_LOADED
  -include "${PROJECT_DIR}/../qr_display_fw/include/tft_setup_spi_cs5_rst4.h"
